<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Lead Dashboard</title>
    <style>
        body { margin: 0; background: #111827; color: white; font-family: Arial, sans-serif; padding: 40px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .dashboard { width: 100%; max-width: 900px; background: #1f2937; padding: 25px; border-radius: 16px; box-shadow: 0 0 30px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #374151; }
        th { background: #374151; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .Hot-Lead { background: #ef4444; color: white; }
        .Warm-Lead { background: #f59e0b; color: white; }
        .Cold-Lead { background: #6b7280; color: white; }
    </style>
</head>
<body>

<div class="dashboard">
    <h3 id="dashTitle">Loading Your Lead Dashboard...</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Service</th>
                <th>Score</th>
                <th>Type</th>
                <th>Summary</th>
            </tr>
        </thead>
        <tbody id="leadTableBody"></tbody>
    </table>
</div>

<script>
    // 🌟 AUTOMATIC EXTRACTOR: Grabs the client ID out of the web address bar automatically!
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id');

    async function loadLeads() {
        if (!clientId) {
            document.getElementById('dashTitle').textContent = "Access Denied: Missing Client ID";
            return;
        }
        
        document.getElementById('dashTitle').textContent = `Lead Dashboard: ${clientId}`;

        try {
            // Fetches ONLY this specific client's records
            const response = await fetch(`/api/leads/${clientId}`);
            const leads = await response.json();
            const tbody = document.getElementById('leadTableBody');
            tbody.innerHTML = '';
            
            leads.forEach(lead => {
                const cleanType = lead.type ? lead.type.replace(' ', '-') : 'Cold-Lead';
                const row = `<tr>
                    <td><b>${lead.name || ''}</b><br><small>${lead.phone || ''}</small></td>
                    <td>${lead.service || ''}</td>
                    <td>${lead.leadScore || 0}/100</td>
                    <td><span class="badge ${cleanType}">${lead.type || 'Cold Lead'}</span></td>
                    <td>${lead.summary || ''}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        } catch (err) { console.error(err); }
    }

    loadLeads();
    setInterval(loadLeads, 10000); // Auto-refreshes every 10 seconds to check for new leads!
</script>
</body>
</html>
