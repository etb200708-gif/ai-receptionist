<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body { margin: 0; background: #111827; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #1f2937; padding: 30px; border-radius: 16px; box-shadow: 0 0 30px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; background: #374151; border: none; border-radius: 8px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #4b5563; }
    </style>
</head>
<body>

<div class="container">
    <h2>Submit Your Request</h2>
    <form id="leadForm">
        <!-- 🌟 HIDDEN FIELD: This tells the AI which client should get this lead! -->
        <input type="hidden" id="clientId" value="client_roofing_pro">

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="input-group">
            <label>Phone</label>
            <input type="text" id="phone" required>
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="input-group">
            <label>How can we help you?</label>
            <textarea id="service" rows="3" required></textarea>
        </div>
        <button type="submit" id="submitBtn">Submit Request</button>
    </form>
</div>

<script>
    document.getElementById('leadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Sending...';
        btn.disabled = true;
        
        const data = {
            clientId: document.getElementById('clientId').value, // Tracks the client
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            service: document.getElementById('service').value
        };

        try {
            const res = await fetch('/api/analyze-lead', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert("Thank you! Your request has been sent.");
                document.getElementById('leadForm').reset();
            } else { alert("Error submitting request."); }
        } catch (err) { alert("Network error."); }
        finally { btn.textContent = 'Submit Request'; btn.disabled = false; }
    });
</script>
</body>
</html>
